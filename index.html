<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cofyra Elm</title>
        <link rel="stylesheet" href="reset.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header>
            <img
                class="headerLogo"
                src="./images/HeroCELogo.svg"
                alt="Cofyra Elm footer logo"
            />
            <ul class="menu">
                <li><a href="#products">Products</a></li>
                <li><a href="#process">Process</a></li>
                <li><a href="#story">Story</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </header>

        <div id="Hero" class="sectionSize">
            <img
                class="heroCELogo"
                src="./images/HeroCELogo.svg"
                alt="Cofyra Elm hero logo"
            />
            <img
                class="heroBackImage"
                src="./images/HeroImage.jpg"
                alt="hero background image"
            />
        </div>

        <section id="About">
            <div class="about contents">
                <h1>About</h1>
                <img
                    class="aboutCELogo"
                    src="./images/aboutCELogo.svg"
                    alt=""
                />
                <p class="brand poetic message">
                    Material Love. <br />Touch, and Fall in Love.
                </p>
                <p class="brand rise message">
                    We turn texture itself <br />into the of the brand.
                </p>
            </div>
        </section>

        <section id="Product" class="sectionSize">
            <h1>Product</h1>
            <div id="productContent">
            
            <div class="productView">
                
                <div class="productViewThumnail">
                    <img src="./images/product.webp" alt="" />
                </div>
                
                <div class="productViewArrowbuttons">
                    <button class="prevArrow"></button
                    ><button class="nextArrow"></button>
                </div>
                
                <p class="productViewTitle"></p>
                <p class="productViewDescription"></p>
                
            </div>
            </div>
            
        </section>

        <section id="Process"></section>
        <section id="Explore"></section>
    </body>
</html>
